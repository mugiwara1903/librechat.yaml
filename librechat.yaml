version: 1.2.1
cache: true
endpoints:
  custom:
    - name: "Mistral"
      apiKey: "${MISTRAL_API_KEY}"
      baseURL: "https://api.mistral.ai/v1"
      models:
        default: ["mistral-small-latest", "mistral-large-latest"]
        fetch: true
      titleConvo: true
      titleModel: "mistral-small-latest"
      modelDisplayLabel: "Mistral"
      dropParams: ["user", "frequency_penalty", "presence_penalty"]
